        function getPlatformName(platform) {
            if (platform === 'facebook') return 'فيسبوك';
            if (platform === 'instagram') return 'إنستغرام';
            if (platform === 'tiktok') return 'تيك توك';
            return platform;
        }

        function loadOrdersFromServer(callback) {
            db.ref('orders').on('value', (snapshot) => {
                const data = snapshot.val();
                store.orders = [];
                if (data) {
                    for (let key in data) {
                        store.orders.push({ id: key, ...data[key] });
                    }
                }
                store.orders.reverse();
                if (callback) callback();
            });
        }

        function switchPage(id) {
            document.querySelectorAll('section').forEach(el => el.classList.remove('active'));
            const targetPage = document.getElementById('page-' + id);
            if(targetPage) {
                targetPage.classList.add('active');
            }
            if(id === 'shop') renderShop();
            window.scrollTo(0,0);
        }

        function renderShop(filter = 'all') {
            const grid = document.getElementById('shop-grid');
            if(!grid) return;
            grid.innerHTML = '';
            const items = filter === 'all' ? store.packages : store.packages.filter(p => p.platform === filter && p.active);
            if(items.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center;">لا توجد باقات متاحة لهذه المنصة.</p>';
                return;
            }
            items.forEach(pkg => {
                const badge = pkg.platform === 'facebook' ? 'badge-fb' : (pkg.platform === 'instagram' ? 'badge-ig' : 'badge-tt');
                const card = document.createElement('div');
                card.className = 'service-card';
                card.innerHTML = `
                    <div class="platform-badge ${badge}">${getPlatformName(pkg.platform)}</div>
                    <h3>${pkg.quantity.toLocaleString()}</h3>
                    <div class="price-tag">${pkg.price} ج.م</div>
                    <p style="font-size:0.9rem; color:var(--text-muted);">${pkg.description}</p>
                    <div class="delivery-info">${pkg.deliveryInfo}</div>
                    <button class="btn-primary" onclick="openOrder('${pkg.id}')">اطلب الآن</button>
                `;
                grid.appendChild(card);
            });
        }
        function filterServices(platform) { renderShop(platform); }

        let orderStep = 1;

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function openOrder(pkgId) {
            const pkg = store.packages.find(p => p.id === pkgId);
            if(!pkg) return alert('الباقة غير موجودة');
            document.getElementById('orderSteps').style.display = 'block';
            document.getElementById('invoiceBox').classList.remove('active');
            document.getElementById('invoiceBox').style.display = 'none';
            document.getElementById('paymentProof').value = '';
            document.getElementById('modalTitle').innerText = `طلب: ${pkg.quantity.toLocaleString()} متابعين لـ ${getPlatformName(pkg.platform)}`;
            document.getElementById('orderPlatform').value = pkg.platform;
            document.getElementById('orderQuantity').value = pkg.quantity;
            document.getElementById('orderPrice').value = pkg.price + ' ج.م';
            document.querySelectorAll('.order-step').forEach(el => el.classList.remove('active'));
            document.getElementById('step1').classList.add('active');
            orderStep = 1;
            document.getElementById('orderModal').classList.add('active');
        }

        function nextStep(step) {
            if(step === 2) { if(!document.getElementById('orderQuantity').value) return alert('الرجاء تحديد العدد'); }
            if(step === 3) {
                const account = document.getElementById('orderAccount').value;
                const name = document.getElementById('orderName').value;
                const contact = document.getElementById('orderContact').value;
                if(!account || !name || !contact) return alert('الرجاء ملء جميع الحقول');
                document.getElementById('rPlatform').innerText = getPlatformName(document.getElementById('orderPlatform').value);
                document.getElementById('rQuantity').innerText = document.getElementById('orderQuantity').value;
                document.getElementById('rPrice').innerText = document.getElementById('orderPrice').value.replace(' ج.م','');
                document.getElementById('rAccount').innerText = account;
                document.getElementById('rName').innerText = name;
            }
            document.querySelectorAll('.order-step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            orderStep = step;
        }
        function prevStep(step) {
            document.querySelectorAll('.order-step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            orderStep = step;
        }

        async function placeOrder() {
            const platform = document.getElementById('orderPlatform').value;
            const quantity = document.getElementById('orderQuantity').value;
            const price = document.getElementById('orderPrice').value.replace(' ج.م','');
            const account = document.getElementById('orderAccount').value;
            const name = document.getElementById('orderName').value;
            const contact = document.getElementById('orderContact').value;
            const date = new Date().toLocaleDateString();
            const invoiceNumber = 'INV-' + Date.now().toString().slice(-6);

            const fileInput = document.getElementById('paymentProof');
            let proofBase64 = null;
            if(fileInput.files.length > 0) {
                const file = fileInput.files[0];
                proofBase64 = await toBase64(file);
            }

            const order = {
                invoiceNumber: invoiceNumber,
                customerName: name,
                contact: contact,
                platform: platform,
                account: account,
                quantity: parseInt(quantity),
                price: parseInt(price),
                total: parseInt(price),
                date: date,
                orderStatus: 'pending',
                paymentStatus: 'pending',
                paymentProof: proofBase64
            };

            await db.ref('orders').push(order);

            document.getElementById('orderSteps').style.display = 'none';
            const invoiceBox = document.getElementById('invoiceBox');
            invoiceBox.style.display = 'block';
            invoiceBox.classList.add('active');
            
            const pName = getPlatformName(platform);

            document.getElementById('invoiceContent').innerHTML = `
                <div style="border: 1px solid #ddd; padding: 20px; border-radius:8px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #eee; padding-bottom:10px; margin-bottom:15px;">
                        <div><h2 style="font-size:1.5rem; margin:0; color: #333;">YSOO200</h2><small style="color:#666;">نمو وسائل التواصل</small></div>
                        <div style="text-align:right;"><h4 style="margin:0;">رقم الفاتورة #${invoiceNumber}</h4><small>${date}</small></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                        <div><strong>العميل:</strong> ${name}<br><strong>رقم التواصل:</strong> ${contact}</div>
                        <div><strong>الحساب:</strong> ${account}</div>
                    </div>
                    <table style="width:100%; border-collapse:collapse; margin-bottom:20px;">
                        <tr style="background:#f5f5f5;"><th style="padding:8px; text-align:right;">الخدمة</th><th style="padding:8px;">العدد</th><th style="padding:8px;">السعر</th><th style="padding:8px;">الإجمالي</th></tr>
                        <tr><td style="padding:8px; border-bottom:1px solid #eee;">متابعين ${pName}</td><td style="padding:8px; border-bottom:1px solid #eee; text-align:center;">${quantity}</td><td style="padding:8px; border-bottom:1px solid #eee; text-align:center;">${price} ج.م</td><td style="padding:8px; border-bottom:1px solid #eee; text-align:center;">${price} ج.م</td></tr>
                    </table>
                    <div style="text-align:right; font-weight:bold; font-size:1.2rem;">الإجمالي: ${price} ج.م</div>
                    <div style="margin-top:20px; font-size:0.9rem; color:#555; border-top:1px solid #eee; padding-top:15px;">
                        <p><strong>حالة الطلب:</strong> <span style="color:#faa61a;">قيد الانتظار</span> | <strong>حالة الدفع:</strong> <span style="color:#faa61a;">قيد الانتظار</span></p>
                        <p>شكراً لاختيارك YSOO200!</p>
                    </div>
                </div>
            `;
            document.getElementById('modalTitle').innerText = 'تم تأكيد الطلب!';
        }

        function renderAdminStats() {
            const content = document.getElementById('adminContent');
            const totalOrders = store.orders.length;
            const pending = store.orders.filter(o => o.orderStatus === 'pending').length;
            const completed = store.orders.filter(o => o.orderStatus === 'completed').length;
            const totalSales = store.orders.reduce((acc, o) => acc + (o.orderStatus === 'completed' ? o.total : 0), 0);
            const igOrders = store.orders.filter(o => o.platform === 'instagram').length;
            const fbOrders = store.orders.filter(o => o.platform === 'facebook').length;
            const ttOrders = store.orders.filter(o => o.platform === 'tiktok').length;
            
            content.innerHTML = `
                <h3>الملخص</h3>
                <div class="stats-grid">
                    <div class="stat-card"><h4>إجمالي الطلبات</h4><span>${totalOrders}</span></div>
                    <div class="stat-card"><h4>قيد الانتظار</h4><span>${pending}</span></div>
                    <div class="stat-card"><h4>مكتملة</h4><span>${completed}</span></div>
                    <div class="stat-card"><h4>إجمالي المبيعات</h4><span>${totalSales} ج.م</span></div>
                    <div class="stat-card"><h4>إنستغرام</h4><span>${igOrders}</span></div>
                    <div class="stat-card"><h4>فيسبوك</h4><span>${fbOrders}</span></div>
                    <div class="stat-card"><h4>تيك توك</h4><span>${ttOrders}</span></div>
                </div>
            `;
        }

            const modal = document.getElementById('imageViewerModal');

            document.getElementById('imageViewerModal').classList.remove('active');
            document.getElementById('viewerImage').src = '';

        function renderAdminOrders() {
            const content = document.getElementById('adminContent');
            if(store.orders.length === 0) { content.innerHTML = `<h3>الطلبات</h3><p style="color:var(--text-muted);">لا توجد طلبات بعد.</p>`; return; }

                <tbody id="adminOrdersBody">
            `;
            store.orders.forEach(o => {
                const statusClass = o.orderStatus === 'completed' ? 'status-completed' : 'status-pending';
                const proofBtn = o.paymentProof ? `<button class="btn-sm btn-edit" onclick="viewPaymentProof('${o.paymentProof}')">عرض</button>` : 'لا يوجد';
                html += `
                    <tr>
                        <td>${o.invoiceNumber}</td>
                        <td>${o.customerName}</td>
                        <td style="max-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            <a href="${o.account}" target="_blank" style="color: var(--accent); text-decoration: underline;">${o.account}</a>
                            <button class="btn-sm btn-edit" onclick="navigator.clipboard.writeText('${o.account}').then(()=>alert('تم النسخ!'))" style="padding: 2px 6px; font-size: 0.6rem; margin-top: 2px;">نسخ</button>
                        </td>
                        <td>${getPlatformName(o.platform)}</td>
                        <td>${o.quantity}</td>
                        <td>${o.total} ج.م</td>
                        <td>${o.date}</td>
                        <td><span class="status-badge ${statusClass}">${o.orderStatus}</span></td>
                        <td>${proofBtn}</td>
                        <td>
                            <button class="btn-sm btn-edit" onclick="updateOrderStatus('${o.id}', 'completed')">إكمال</button>
                            <button class="btn-sm btn-del" onclick="updateOrderStatus('${o.id}', 'cancelled')">إلغاء</button>
                        </td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            content.innerHTML = html;
        }

        function filterAdminOrders(val) {
            const rows = document.querySelectorAll('#adminOrdersBody tr');
            rows.forEach(row => { const text = row.innerText.toLowerCase(); row.style.display = text.includes(val.toLowerCase()) ? '' : 'none'; });
        }

        function updateOrderStatus(id, status) {
            const order = store.orders.find(o => o.id === id);
            if(order) {
                order.orderStatus = status;
                db.ref('orders/' + id).update({ orderStatus: status });
                renderAdminOrders();
                renderAdminStats();
            }
        }

                    <div class="service-card" style="text-align:left;">
                        <div class="platform-badge ${badge}">${getPlatformName(pkg.platform)}</div>
                        <h3 style="font-size:1.5rem; margin:10px 0;">${pkg.quantity.toLocaleString()} متابعين</h3>

                        <div style="display:flex; gap:10px; margin-top:15px;">

                        </div>
                    </div>`;
            });
            html += `</div>`;
            content.innerHTML = html;

        function openAddPackage() {
            const platform = prompt('أدخل المنصة (instagram أو facebook أو tiktok):');
            if(!platform || !['instagram', 'facebook', 'tiktok'].includes(platform.toLowerCase())) return alert('منصة غير صحيحة');
            const qty = prompt('أدخل العدد:');
            const price = prompt('أدخل السعر (ج.م):');
            if(qty && price) {
                const newPkg = { id: 'pkg-' + Date.now(), platform: platform.toLowerCase(), quantity: parseInt(qty), price: parseInt(price), description: 'متابعين حقيقيين', deliveryInfo: 'فوري', active: true };
                store.packages.push(newPkg);
                saveState();
                renderAdminPackages();
            }
        }

        function editPackage(id) {
            const pkg = store.packages.find(p => p.id === id);
            if(!pkg) return;
            const qty = prompt('تعديل العدد:', pkg.quantity);
            const price = prompt('تعديل السعر:', pkg.price);
            const status = prompt('تحديث الحالة (true/false):', pkg.active);
            if(qty) pkg.quantity = parseInt(qty);
            if(price) pkg.price = parseInt(price);
            pkg.active = status === 'true' || status === '1' ? true : false;
            saveState();
            renderAdminPackages();
        }

        function deletePackage(id) {
            if(confirm('هل أنت متأكد من حذف هذه الباقة؟')) {
                store.packages = store.packages.filter(p => p.id !== id);
                saveState();
                renderAdminPackages();
            }
        }

        function renderAdminInvoices() {
            const content = document.getElementById('adminContent');
            let html = `<h3>سجل الفواتير</h3>
            <input type="text" placeholder="البحث برقم الفاتورة أو اسم العميل..." onkeyup="filterAdminInvoices(this.value)" style="width:100%; padding:10px; margin-bottom:15px; background:var(--bg-dark); border:1px solid rgba(255,255,255,0.1); border-radius:6px; color:white;">
            <table class="admin-table">
                <thead><tr><th>رقم الفاتورة</th><th>العميل</th><th>المنصة</th><th>الإجمالي</th><th>التاريخ</th></tr></thead>
                <tbody id="adminInvoicesBody">`;
            store.orders.forEach(o => {
                html += `
                    <tr>
                        <td>${o.invoiceNumber}</td>
                        <td>${o.customerName}</td>
                        <td>${getPlatformName(o.platform)}</td>
                        <td>${o.total} ج.م</td>
                        <td>${o.date}</td>
                    </tr>
                `;
            });
            html += `</tbody></table>`;
            content.innerHTML = html;
        }

        function filterAdminInvoices(val) {
            const rows = document.querySelectorAll('#adminInvoicesBody tr');
            rows.forEach(row => { const text = row.innerText.toLowerCase(); row.style.display = text.includes(val.toLowerCase()) ? '' : 'none'; });
        }
    </script>
